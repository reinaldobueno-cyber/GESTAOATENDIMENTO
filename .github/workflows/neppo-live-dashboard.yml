name: Atualizar dashboard NEPPO

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 11-23 * * 1-5'

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar dados do NEPPO e sanitizar HTML público
        shell: pwsh
        env:
          NEPPO_TOKEN: ${{ secrets.NEPPO_TOKEN }}
          NEPPO_CLIENT_KEY: ${{ secrets.NEPPO_CLIENT_KEY }}
          NEPPO_CLIENT_SECRET: ${{ secrets.NEPPO_CLIENT_SECRET }}
          NEPPO_USERNAME: ${{ secrets.NEPPO_USERNAME }}
          NEPPO_PASSWORD: ${{ secrets.NEPPO_PASSWORD }}
        run: |
          $month = [int](Get-Date).Month
          ./sync-neppo-data.ps1 -Year 2026 -StartMonth 1 -EndMonth $month -ExportDir exports -NoMirrorRoot
          ./Protect-PublicDashboardData.ps1 -HtmlPath index.html

      - name: Commit se houver atualização
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if (-not (git diff --cached --quiet)) {
            git commit -m "Atualiza dashboard NEPPO ao vivo"
            git push
          } else {
            Write-Output "Sem alterações para publicar."
          }
