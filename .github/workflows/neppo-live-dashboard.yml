name: Atualizar dashboard NEPPO legado

on:
  workflow_dispatch:
  # Fluxo legado mantido apenas para historico. A atualizacao operacional do
  # NEPPO agora acontece no Worker/KV, de segunda a sexta, 08:00-18:00.
  # Este workflow nao deve regenerar index.html nem publicar Cloudflare.

permissions:
  contents: read

jobs:
  disabled-legacy-dashboard:
    runs-on: windows-latest
    steps:
      - name: Publicador legado desativado
        shell: pwsh
        run: |
          Write-Output "Publicador legado do dashboard NEPPO desativado. Use o Worker/KV."
