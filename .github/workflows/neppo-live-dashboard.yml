name: Acionar atualizacao NEPPO Worker

on:
  workflow_dispatch:
  # Acionador sem estado local: chama o Worker/KV e nunca regenera index.html,
  # nunca commita e nunca publica Cloudflare.
  # Rotina oficial: Cloudflare Worker Cron em wrangler.jsonc.

permissions:
  contents: read

jobs:
  trigger-worker-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar Worker NEPPO
        shell: bash
        env:
          NEPPO_REFRESH_SECRET: ${{ secrets.NEPPO_CLIENT_SECRET }}
        run: |
          test -n "$NEPPO_REFRESH_SECRET"
          curl --fail --silent --show-error --retry 2 --retry-delay 10 \
            -X POST \
            -H "X-Neppo-Refresh-Secret: $NEPPO_REFRESH_SECRET" \
            "https://gestaoatendimento.reinaldo-bueno.workers.dev/api/neppo-live/cron"
